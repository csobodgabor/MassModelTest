<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebXR AR — 10x10cm Kocka Elhelyezése</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;font-family:system-ui,Arial}

#info{
	position:absolute;
	left:10px;
	top:10px;
	z-index:2;
	background:rgba(0,0,0,0.4);
	color:white;
	padding:8px;
	border-radius:6px;
	font-size:14px;
}

#controls{
	position:absolute;
	right:10px;
	top:10px;
	z-index:2;
	display:flex;
	flex-direction:column;
	gap:10px;
}

#start-ar-btn{
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	color: white;
	border: none;
	padding: 12px 20px;
	border-radius: 8px;
	font-size: 16px;
	font-weight: bold;
	cursor: pointer;
	transition: all 0.3s ease;
	box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

#start-ar-btn:hover{
	transform: translateY(-2px);
	box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

#start-ar-btn:active{
	transform: translateY(0);
}

#start-ar-btn:disabled{
	background: #cccccc;
	cursor: not-allowed;
	transform: none;
}

#enter-ar{
	/* AR gomb helye a JS-ből */
}

#status{
	position:absolute;
	left:10px;
	bottom:10px;
	z-index:2;
	background:rgba(0,0,0,0.4);
	color:white;
	padding:8px;
	border-radius:6px;
	font-size:12px;
	max-width: 300px;
}

canvas{display:block}
</style>
</head>
<body>
<div id="info">
	<strong>AR Kocka Elhelyező</strong><br>
	1. Kattints az "AR Indítása" gombra<br>
	2. Engedélyezd a kamera hozzáférést<br>
	3. Érintés = 10x10cm kocka elhelyezése
</div>

<div id="controls">
	<button id="start-ar-btn">AR Indítása</button>
	<div id="enter-ar"></div>
</div>

<div id="status">
	Állapot: Várakozás az inicializálásra...
</div>

<script type="module">
import { initAR, cleanup } from './MassModelTest.js';

// ---- UI ELEMENTS ----
const startButton = document.getElementById('start-ar-btn');
const statusDiv = document.getElementById('status');

// ---- EVENT LISTENERS ----
startButton.addEventListener('click', handleStartAR);

// ---- FUNCTIONS ----
function handleStartAR() {
	try {
		updateStatus('AR inicializálása...', 'info');
		startButton.disabled = true;
		startButton.textContent = 'Inicializálás...';
		
		// Check WebXR support
		if (!navigator.xr) {
			throw new Error('WebXR nem támogatott ezen a böngészőn');
		}
		
		// Initialize AR
		initAR();
		
		updateStatus('AR sikeresen inicializálva! Használd az "Enter AR" gombot.', 'success');
		startButton.textContent = 'AR Inicializálva ✓';
		
	} catch (error) {
		console.error('AR initialization failed:', error);
		updateStatus(`Hiba az AR inicializáláskor: ${error.message}`, 'error');
		startButton.disabled = false;
		startButton.textContent = 'Próbáld újra';
	}
}

function updateStatus(message, type = 'info') {
	statusDiv.textContent = `Állapot: ${message}`;
	statusDiv.style.background = type === 'error' ? 'rgba(220,20,60,0.8)' : 
								 type === 'success' ? 'rgba(34,139,34,0.8)' : 
								 'rgba(0,0,0,0.4)';
}

// ---- CLEANUP ON PAGE UNLOAD ----
window.addEventListener('beforeunload', () => {
	cleanup();
});

// ---- INITIAL STATUS ----
updateStatus('Kattints az "AR Indítása" gombra a kezdéshez');
</script>
</body>
</html>
